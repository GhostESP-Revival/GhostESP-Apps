name: Build and Deploy to R2

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'

  workflow_dispatch:
    inputs:
      app_id:
        description: 'Build and deploy only this app ID (takes precedence over rebuild_all)'
        type: string
        default: ''
      rebuild_all:
        description: 'Build every catalog app instead of only changed apps'
        type: boolean
        default: true

env:
  R2_BUCKET: ghostesp-marketplace
  R2_PUBLIC_URL: https://gesp.fuckyourcdn.com
  GHOSTESP_REPO: https://github.com/GhostESP-Revival/GhostESP.git
  GHOSTESP_BRANCH: two-point-zero

jobs:
  select-apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_builds: ${{ steps.select.outputs.has_builds }}
      catalog_needed: ${{ steps.select.outputs.catalog_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select apps to build
        id: select
        env:
          APP_ID: ${{ inputs.app_id || '' }}
          EVENT_BEFORE: ${{ github.event.before }}
          REBUILD_ALL: ${{ inputs.rebuild_all || 'false' }}
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          apps_dir = Path('apps')
          requested_id = os.environ.get('APP_ID', '').strip()
          catalog_needed = False

          def all_app_ids():
              return sorted(path.parent.name for path in apps_dir.glob('*/manifest.json'))

          if requested_id:
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]*', requested_id):
                  raise RuntimeError(f'Invalid app ID: {requested_id!r}')
              manifest_path = apps_dir / requested_id / 'manifest.json'
              if not manifest_path.is_file():
                  raise RuntimeError(f'Unknown app ID: {requested_id}')
              app_ids = [requested_id]
              catalog_needed = True
              print(f'Manual build requested for: {requested_id}')
          elif os.environ.get('REBUILD_ALL') == 'true':
              app_ids = all_app_ids()
              catalog_needed = True
              print('Manual full rebuild requested')
          else:
              before = os.environ.get('EVENT_BEFORE', '')
              head = os.environ.get('GITHUB_SHA', 'HEAD')
              if not before or before == '0' * 40:
                  app_ids = all_app_ids()
                  catalog_needed = True
                  print('No base commit available; building all apps')
              else:
                  changed = subprocess.run(
                      ['git', 'diff', '--name-only', before, head, '--', 'apps'],
                      check=True, capture_output=True, text=True
                  ).stdout.splitlines()
                  changed_ids = {
                      path.split('/')[1]
                      for path in changed
                      if path.startswith('apps/') and len(path.split('/')) >= 2
                  }
                  app_ids = sorted(
                      app_id for app_id in changed_ids
                      if (apps_dir / app_id / 'manifest.json').is_file()
                  )
                  catalog_needed = bool(changed_ids)
                  print(f'Changed apps: {", ".join(sorted(changed_ids)) if changed_ids else "none"}')

          matrix_apps = []
          for app_id in app_ids:
              with open(apps_dir / app_id / 'manifest.json') as f:
                  manifest = json.load(f)
              if manifest.get('type') == 'app':
                  matrix_apps.append({'app_id': app_id})

          matrix = json.dumps({'include': matrix_apps}, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={matrix}\n')
              f.write(f'has_builds={str(bool(matrix_apps)).lower()}\n')
              f.write(f'catalog_needed={str(catalog_needed).lower()}\n')
        shell: python

  build-apps:
    needs: select-apps
    if: needs['select-apps'].outputs.has_builds == 'true'
    name: Build ${{ matrix.app_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-apps.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ghostbt
        run: pip install ghostbt

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghostbt/esp-idf
            ~/.espressif
          key: esp-idf-v6.0.1-tools

      - name: Install ESP-IDF
        run: |
          gbt setup
          ~/.ghostbt/esp-idf/install.sh esp32 esp32s2 esp32s3 esp32c5 esp32c6

      - name: Cache GhostESP firmware
        uses: actions/cache@v4
        with:
          path: ghostesp-firmware
          key: ghostesp-firmware-${{ env.GHOSTESP_BRANCH }}
          restore-keys: |
            ghostesp-firmware-${{ env.GHOSTESP_BRANCH }}-

      - name: Update GhostESP firmware
        run: |
          if [ -d "ghostesp-firmware/.git" ]; then
            git -C ghostesp-firmware fetch --depth=1 origin ${{ env.GHOSTESP_BRANCH }}
            git -C ghostesp-firmware checkout --force FETCH_HEAD
            git -C ghostesp-firmware submodule sync --recursive
            git -C ghostesp-firmware submodule update --init --recursive --depth 1
          else
            git clone --depth=1 --recurse-submodules -b ${{ env.GHOSTESP_BRANCH }} ${{ env.GHOSTESP_REPO }} ghostesp-firmware
          fi

      - name: Build and upload app
        env:
          APP_ID: ${{ matrix.app_id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          import json
          import subprocess
          import os
          import glob
          import shutil

          r2_bucket = os.environ['R2_BUCKET']
          r2_url = os.environ['R2_PUBLIC_URL']
          r2_endpoint = os.environ['R2_ENDPOINT']
          firmware_dir = os.path.abspath('ghostesp-firmware')
          failures = []

          app_id = os.environ['APP_ID']
          manifest_path = f'apps/{app_id}/manifest.json'
          if not os.path.isfile(manifest_path):
              raise RuntimeError(f'Manifest not found for {app_id}')
          manifest_paths = [manifest_path]
          print(f'Matrix build requested for: {app_id}')

          for manifest_path in manifest_paths:
              with open(manifest_path) as f:
                  manifest = json.load(f)

              if manifest.get('type') != 'app':
                  continue

              app_id = manifest['id']
              version = manifest['version']
              targets = manifest.get('targets', ['esp32s3'])
              source_repo = manifest.get('source_repo', '')
              source_branch = manifest.get('source_branch', 'main')
              source_subdir = manifest.get('source_subdir', '.')

              if not source_repo:
                  print(f"Skipping {app_id}: no source_repo")
                  failures.append(f'{app_id}: no source_repo')
                  continue

              # Normalize URLs for comparison (strip .git suffix and trailing slashes)
              def normalize_url(url):
                  return url.rstrip('/').removesuffix('.git')

              source_repo_norm = normalize_url(source_repo)
              firmware_repo_norm = normalize_url(os.environ.get('GHOSTESP_REPO', ''))

              # Determine source directory
              if source_repo_norm == firmware_repo_norm and source_branch == os.environ['GHOSTESP_BRANCH']:
                  # Reuse the cached firmware checkout only when it is on the requested branch.
                  source_dir = os.path.join(firmware_dir, source_subdir)
                  print(f"Using firmware tree: {source_dir}")
              else:
                  # Clone external repo
                  clone_dir = f'sources/{app_id}'
                  if os.path.isdir(clone_dir):
                      shutil.rmtree(clone_dir)
                  print(f"Cloning {source_repo} at {source_branch}...")
                  result = subprocess.run(
                      ['git', 'clone', '--depth=1', '--recurse-submodules', '-b', source_branch, source_repo, clone_dir],
                      capture_output=True, text=True
                  )
                  if result.returncode != 0:
                      print(f"Clone failed for {app_id}: {result.stderr}")
                      failures.append(f'{app_id}: source clone failed')
                      continue
                  source_dir = os.path.join(clone_dir, source_subdir) if source_subdir != '.' else clone_dir

              if not os.path.isdir(source_dir):
                  print(f"Skipping {app_id}: source dir not found: {source_dir}")
                  failures.append(f'{app_id}: source directory not found')
                  continue

              # Upload preview image if specified
              preview_file = manifest.get('preview', '')
              if preview_file:
                  preview_path = os.path.join(source_dir, preview_file)
                  if os.path.isfile(preview_path):
                      r2_key = f"apps/{app_id}/{preview_file}"
                      subprocess.run([
                          'aws', 's3', 'cp', preview_path, f"s3://{r2_bucket}/{r2_key}",
                          '--endpoint-url', r2_endpoint,
                          '--content-type', 'image/png'
                      ], check=True)
                      print(f"Uploaded preview: {r2_url}/{r2_key}")

              # Clean build artifacts and stale sdkconfig to ensure fresh build
              build_dir = os.path.join(source_dir, 'build')
              if os.path.isdir(build_dir):
                  shutil.rmtree(build_dir)
              for f in ('sdkconfig', 'sdkconfig.old'):
                  p = os.path.join(source_dir, f)
                  if os.path.isfile(p):
                      os.remove(p)
                      print(f"Removed stale {f}")

              # Debug: show sdkconfig.defaults
              sdkconfig_defaults = os.path.join(source_dir, 'sdkconfig.defaults')
              if os.path.isfile(sdkconfig_defaults):
                  print(f"Found sdkconfig.defaults at {sdkconfig_defaults}")
                  with open(sdkconfig_defaults) as sf:
                      for line in sf:
                          if 'ELF_DYNAMIC' in line or 'SPIRAM' in line:
                              print(f"  {line.rstrip()}")
              else:
                  print(f"WARNING: No sdkconfig.defaults found at {sdkconfig_defaults}")

              for target in targets:
                  print(f"\n{'='*60}")
                  print(f"Building {app_id} v{version} for {target}...")
                  print(f"{'='*60}")
                  package_dir = os.path.join('build', app_id)
                  if os.path.isdir(package_dir):
                      shutil.rmtree(package_dir)
                  result = subprocess.run(
                      ['gbt', 'dist', '--target', target, '--gapp', '--out', package_dir, source_dir]
                  )
                  if result.returncode != 0:
                      print(f"Build failed for {app_id}/{target}")
                      failures.append(f'{app_id}/{target}: build failed')
                      # Debug: show what was produced
                      if os.path.isdir(build_dir):
                          print(f"Build dir contents:")
                          for f in os.listdir(build_dir):
                              if f.endswith(('.bin', '.so', '.elf')):
                                  print(f"  {f}")
                      continue

                  gapp_files = glob.glob(os.path.join(package_dir, '**', '*.gapp'), recursive=True)
                  if not gapp_files:
                      print(f"Build produced no package for {app_id}/{target}")
                      failures.append(f'{app_id}/{target}: no .gapp produced')
                      continue
                  expected_filename = f'{app_id}-{version}-{target}.gapp'
                  if not any(os.path.basename(gapp) == expected_filename for gapp in gapp_files):
                      print(f"Build produced no expected package for {app_id}/{target}: {expected_filename}")
                      failures.append(f'{app_id}/{target}: expected .gapp not produced')
                      continue
                  for gapp in gapp_files:
                      filename = os.path.basename(gapp)
                      r2_key = f"apps/{app_id}/v{version}/{filename}"

                      subprocess.run([
                          'aws', 's3', 'cp', gapp, f"s3://{r2_bucket}/{r2_key}",
                          '--endpoint-url', r2_endpoint,
                          '--content-type', 'application/octet-stream'
                      ], check=True)

                      print(f"Uploaded: {r2_url}/{r2_key}")

          if failures:
              raise RuntimeError('App build/upload failures: ' + '; '.join(failures))
        shell: python

  regenerate-catalog:
    needs: [select-apps, build-apps]
    if: >-
      always() &&
      needs['select-apps'].result == 'success' &&
      needs['select-apps'].outputs.catalog_needed == 'true' &&
      (needs['build-apps'].result == 'success' || needs['build-apps'].result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate catalog.json
        run: |
          import json
          import os
          import glob
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          r2_url = os.environ['R2_PUBLIC_URL']

          def package_available(url):
              request = urllib.request.Request(
                  url, method='HEAD', headers={'User-Agent': 'GhostESP catalog builder'}
              )
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return 200 <= response.getcode() < 300
                  except urllib.error.HTTPError as err:
                      if not 500 <= err.code < 600:
                          print(f'Package unavailable (HTTP {err.code}): {url}')
                          return False
                      reason = f'HTTP {err.code}'
                  except urllib.error.URLError as err:
                      reason = str(err.reason)
                  if attempt < 2:
                      print(f'Package check failed ({reason}); retrying: {url}')
                      time.sleep(2 ** attempt)
              print(f'Package unavailable after retries: {url}')
              return False

          catalog = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'apps': []
          }

          for manifest_path in sorted(glob.glob('apps/*/manifest.json')):
              with open(manifest_path) as f:
                  manifest = json.load(f)

              if manifest.get('type') != 'app':
                  continue

              app_id = manifest['id']
              version = manifest['version']
              targets = manifest.get('targets', [])
              preview_file = manifest.get('preview', '')

              downloads = {}
              available_targets = []
              for target in targets:
                  filename = f"{app_id}-{version}-{target}.gapp"
                  url = f"{r2_url}/apps/{app_id}/v{version}/{filename}"
                  if package_available(url):
                      downloads[target] = url
                      available_targets.append(target)

              if not downloads:
                  print(f'Skipping {app_id}: no published package is available')
                  continue

              entry = {
                  'id': app_id,
                  'name': manifest['name'],
                  'version': version,
                  'authors': manifest.get('authors', ['Unknown']),
                  'category': manifest.get('category', 'Uncategorized'),
                  'description': manifest.get('description', ''),
                  'targets': available_targets,
                  'downloads': downloads,
                  'license': manifest.get('license', ''),
                  'changelog': manifest.get('changelog', ''),
                  'preview': f"{r2_url}/apps/{app_id}/{preview_file}" if preview_file else '',
                  'reviewed': manifest.get('reviewed', False)
              }
              catalog['apps'].append(entry)

          with open('catalog.json', 'w') as f:
              json.dump(catalog, f, indent=2)

          print(f"Generated catalog.json with {len(catalog['apps'])} apps")
        shell: python
        env:
          R2_PUBLIC_URL: ${{ env.R2_PUBLIC_URL }}

      - name: Commit catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --staged --quiet || git commit -m "chore: regenerate catalog.json [skip ci]"
          git pull --rebase origin main
          git push
