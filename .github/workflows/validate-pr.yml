name: Validate App Submissions

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'templates/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/validate-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.changed.outputs.build_matrix }}
      has_builds: ${{ steps.changed.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate manifests
        run: python scripts/validate_manifests.py

      - name: Select changed app targets
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          changed = subprocess.run(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"], "--", "apps"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          app_ids = sorted({path.split("/")[1] for path in changed if path.startswith("apps/") and len(path.split("/")) >= 2})
          builds = []
          for app_id in app_ids:
              manifest_path = Path("apps") / app_id / "manifest.json"
              if not manifest_path.is_file():
                  continue
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              builds.extend({"app_id": app_id, "target": target} for target in manifest["targets"])

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"build_matrix={json.dumps({'include': builds}, separators=(',', ':'))}\n")
              handle.write(f"has_builds={str(bool(builds)).lower()}\n")
        shell: python

  build:
    needs: validate
    if: needs.validate.outputs.has_builds == 'true'
    name: Build ${{ matrix.app_id }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ghostbt
        run: pip install ghostbt==0.5.7

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghostbt/esp-idf
            ~/.espressif
          key: esp-idf-v6.0.1-${{ matrix.target }}
          restore-keys: |
            esp-idf-v6.0.1-

      - name: Install ESP-IDF target
        run: |
          gbt setup --target ${{ matrix.target }}
          source ~/.ghostbt/esp-idf/export.sh >/dev/null
          echo "ESP_ROM_ELF_DIR=$ESP_ROM_ELF_DIR" >> "$GITHUB_ENV"

      - name: Dry-run submission build
        run: python scripts/build_submission.py apps/${{ matrix.app_id }}/manifest.json --target ${{ matrix.target }}
